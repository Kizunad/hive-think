name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # >= 22.18 strips TypeScript types natively, which the tests rely on to
          # import the extension modules directly instead of copying them.
          node-version: 22
      - run: node --test test/index.test.js
